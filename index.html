<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vaanio Move</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script async src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script async src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root{
  --bg:#F7F5F1;--card:#FFFFFF;--sunk:#EFEBE3;--ink:#211F1B;--soft:#8B8577;--line:#E6E1D6;
  --teal:#211F1B;--teal-soft:#EFEBE3;--rani:#211F1B;--rani-soft:#EFEBE3;
  --mari:#8A6A2E;--mari-bg:#6E5527;--mari-soft:#F1E7D2;--leaf:#5B6B52;--leaf-soft:#EBEEE6;
  --red:#8E4038;--red-soft:#F1E3DF;--on:#FFFFFF;--gold:#8A6A2E;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17160F;--card:#201F19;--sunk:#2A2820;--ink:#EEEAE0;--soft:#A39C89;--line:#37352A;
  --teal:#EEEAE0;--teal-soft:#2A2820;--rani:#EEEAE0;--rani-soft:#2A2820;--mari:#D6B679;--mari-bg:#8A6A2E;--mari-soft:#332A18;
  --leaf:#AEBBA2;--leaf-soft:#252A20;--red:#D9998E;--red-soft:#332420;--on:#17160F;--gold:#D6B679;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17160F;--card:#201F19;--sunk:#2A2820;--ink:#EEEAE0;--soft:#A39C89;--line:#37352A;
  --teal:#EEEAE0;--teal-soft:#2A2820;--rani:#EEEAE0;--rani-soft:#2A2820;--mari:#D6B679;--mari-bg:#8A6A2E;--mari-soft:#332A18;
  --leaf:#AEBBA2;--leaf-soft:#252A20;--red:#D9998E;--red-soft:#332420;--on:#17160F;--gold:#D6B679;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:8px}
img{max-width:100%;display:block}
.hd{font-family:"Fraunces","Inter",system-ui,serif;font-weight:500;letter-spacing:-.01em}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 120px}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.logo i{width:28px;height:28px;border-radius:9px;background:var(--teal);display:grid;place-items:center;font-style:normal}
.logo i svg{width:16px;height:16px;color:var(--on)}
.bar .sp{flex:1}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;position:relative}
.ib svg{width:20px;height:20px}
.ib .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--rani);border:2px solid var(--card)}
.me{display:flex;align-items:center;gap:8px;border:0;background:var(--card);border-radius:999px;padding:5px 12px 5px 5px;font-weight:600;font-size:13px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--teal-soft);color:var(--teal);flex:none}
/* type */
h1{font-size:30px;line-height:1.08;margin:10px 0 6px;font-weight:800}
h2{font-size:18px;margin:28px 0 10px;font-weight:700;display:flex;align-items:baseline;gap:8px}
h2 small{font:600 13px "Onest",sans-serif;color:var(--soft)}
.sub{color:var(--soft);margin:0 0 16px}
.muted{color:var(--soft)}.sm{font-size:13px}
/* tiles (product art) */
.tile{position:relative;width:52px;height:52px;border-radius:14px;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.tile .mono{font-family:"Fraunces",serif;font-weight:500;font-size:19px;color:var(--soft);letter-spacing:0}
.tile img{width:100%;height:100%;object-fit:cover}
.tile svg{width:70%;height:70%}
.tile img{width:100%;height:100%;object-fit:cover}
.tile.big{width:84px;height:84px;border-radius:22px}
.stack{display:flex}
.stack .tile{width:44px;height:44px;border-radius:12px;border:2px solid var(--card);margin-left:-14px}
.stack .tile:first-child{margin-left:0}
.stack .more{width:44px;height:44px;border-radius:12px;border:2px solid var(--card);margin-left:-14px;background:var(--sunk);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--soft)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.k-pending,.k-coming{background:var(--mari-soft);color:var(--mari)}
.k-approved{background:var(--teal-soft);color:var(--teal)}
.k-out,.k-partial{background:var(--rani-soft);color:var(--rani)}
.k-closed,.k-back,.k-delivered,.k-in{background:var(--leaf-soft);color:var(--leaf)}
.k-overdue,.k-rejected,.k-issue{background:var(--red-soft);color:var(--red)}
.k-changes,.k-cancelled{background:var(--sunk);color:var(--soft)}
/* movement card */
.cards{display:flex;flex-direction:column;gap:10px}
.mc{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;border:0;background:var(--card);border-radius:20px;padding:14px}
.mc .pl{font-weight:700;font-size:16px;line-height:1.2}
.mc .ln{font-size:13px;color:var(--soft);margin-top:3px}
.mc .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.mc .no{font-size:11px;color:var(--soft);font-weight:600}
.empty{padding:26px 18px;text-align:center;color:var(--soft);background:var(--card);border-radius:20px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
/* hero */
.hero{background:var(--teal);color:var(--on);border-radius:26px;padding:22px 20px 18px;margin-top:6px;position:relative;overflow:hidden}
.hero .big{font-family:"Fraunces",sans-serif;font-size:56px;font-weight:800;line-height:.9;letter-spacing:-.04em}
.hero .lbl{font-size:16px;font-weight:600;margin-top:6px}
.hero .meta{font-size:13px;opacity:.85;margin-top:2px}
.need{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.nd{border:0;border-radius:18px;padding:14px;text-align:left;background:var(--card);display:flex;flex-direction:column;gap:4px}
.nd b{font-family:"Fraunces",sans-serif;font-size:28px;line-height:1}
.nd span{font-size:13px;color:var(--soft);font-weight:600}
.nd.a b{color:var(--mari)}.nd.r b{color:var(--red)}.nd.t b{color:var(--teal)}
/* prompt cards */
.prompt{background:var(--card);border-radius:20px;padding:16px;margin-bottom:10px;border-left:5px solid var(--mari-bg)}
.prompt.q{border-left-color:var(--teal)}
.prompt .t{font-weight:700;font-size:16px}
.prompt .d{color:var(--soft);font-size:13px;margin:2px 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
/* buttons */
.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:700;font-size:15px;background:var(--sunk);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px}
.btn svg{width:19px;height:19px}
.btn.p{background:var(--teal);color:var(--on)}
.btn.g{background:var(--leaf);color:var(--on)}
.btn.r{background:var(--rani);color:var(--on)}
.btn.m{background:var(--mari-bg);color:var(--mari-soft)}
.btn.x{background:var(--red-soft);color:var(--red)}
.btn.w{flex:1}
.btn.full{width:100%}
.btn.s{min-height:40px;padding:9px 14px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -1px 0 var(--line)}
.nav div{max-width:720px;margin:0 auto;display:flex;align-items:flex-end}
.nav button{flex:1;border:0;background:none;padding:10px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--soft);position:relative}
.nav svg{width:23px;height:23px}
.nav [aria-current="page"]{color:var(--teal)}
.nav .bd{position:absolute;top:5px;left:calc(50% + 5px);background:var(--mari-bg);color:var(--mari-soft);font-size:10px;font-weight:800;border-radius:999px;padding:0 5px;line-height:17px;min-width:17px}
.nav .plus span.c{width:52px;height:52px;border-radius:18px;background:var(--teal);color:var(--on);display:grid;place-items:center;margin-top:-22px;box-shadow:0 8px 20px -8px var(--teal)}
.nav .plus span.c svg{width:26px;height:26px}
/* sheet */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(8,14,13,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:90%;overflow:auto;border-radius:26px 26px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.sheet h3{font:800 22px "Fraunces",sans-serif;letter-spacing:-.02em;margin:0 0 4px}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
/* pickers */
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:12px;border:2px solid transparent;background:var(--card);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.prow[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.prow .em{font-size:19px;width:22px;text-align:center;flex:none}
.prow b{flex:1;font-size:15px;font-weight:600;min-width:0}
.prow .a{font-size:12px;color:var(--soft);text-align:right;flex:none;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.add{border:2px dashed var(--line);color:var(--teal);font-weight:700;justify-content:center;gap:8px}
.prow.add svg{width:18px;height:18px}
.opt{border:2px solid transparent;background:var(--card);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:84px;position:relative}
.opt .em{font-size:26px;line-height:1}
.opt b{font-size:15px;line-height:1.2}
.opt span{font-size:12px;color:var(--soft)}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.opt.add{border:2px dashed var(--line);background:none;justify-content:center;align-items:center;text-align:center;color:var(--teal);font-weight:700}
.prod{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.pc{border:2px solid transparent;background:var(--card);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative}
.pc .tile{width:100%;height:auto;aspect-ratio:1;border-radius:14px}
.pc b{font-size:13px;line-height:1.2;font-weight:600}
.pc span{font-size:11px;color:var(--soft)}
.pc.on{border-color:var(--teal)}
.pc .ct{position:absolute;top:6px;right:6px;background:var(--teal);color:var(--on);font-weight:800;font-size:13px;min-width:26px;height:26px;border-radius:13px;display:grid;place-items:center;padding:0 6px}
.pc.add{border:2px dashed var(--line);background:none;justify-content:center;color:var(--teal);font-weight:700;font-size:13px}
.pc.add svg{width:28px;height:28px}
.chipsel{display:flex;flex-wrap:wrap;gap:8px}
.cs{border:0;background:var(--card);border-radius:999px;padding:11px 16px;font-weight:600;font-size:14px}
.cs[aria-pressed="true"]{background:var(--teal);color:var(--on)}
/* wizard */
.wz-top{display:flex;align-items:center;gap:10px;padding:10px 0 4px}
.steps{display:flex;gap:5px;flex:1}
.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.steps i.on{background:var(--teal)}
.wz-q{font-size:28px;font-weight:800;margin:14px 0 4px;line-height:1.1}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);box-shadow:0 -1px 0 var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.tray>div{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.tray .inf{flex:1;min-width:0;font-size:13px;color:var(--soft)}
.tray .inf b{display:block;color:var(--ink);font-size:15px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:0 14px;margin:8px 0 12px}
.search input{flex:1;border:0;background:none;padding:14px 0;outline:none;font-size:16px;min-width:0}
.search svg{width:19px;height:19px;color:var(--soft);flex:none}
.inp{width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;font-family:inherit;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--teal)}
textarea.inp{resize:vertical;min-height:52px}
.fl{display:block;font-size:13px;font-weight:600;color:var(--soft);margin:0 0 6px}
.fld{margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details.more{background:var(--card);border-radius:16px;padding:4px 14px;margin-top:14px}
details.more summary{padding:12px 0;font-weight:700;cursor:pointer;color:var(--teal)}
/* detail */
.journey{display:flex;align-items:flex-start;margin:18px 0 6px}
.js{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:11px;font-weight:600;color:var(--soft);text-align:center}
.js::before{content:"";position:absolute;top:9px;right:50%;width:100%;height:3px;background:var(--line);z-index:0}
.js:first-child::before{display:none}
.js i{width:21px;height:21px;border-radius:50%;background:var(--card);border:3px solid var(--line);position:relative;z-index:1}
.js.on{color:var(--ink)}
.js.on i{background:var(--teal);border-color:var(--teal)}
.js.on::before{background:var(--teal)}
.js.now i{box-shadow:0 0 0 5px var(--teal-soft)}
.box{background:var(--card);border-radius:22px;padding:6px 16px;margin-top:12px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--soft);font-size:14px}
.kv .v{font-weight:600;text-align:right}
.kv .v small{display:block;font-weight:400;color:var(--soft);font-size:13px}
.pieces{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:4px}
.pz{background:var(--card);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:5px;border:2px solid transparent;text-align:left;position:relative}
.pz .tile{width:100%;height:auto;aspect-ratio:1;border-radius:12px}
.pz b{font-size:12px;font-weight:600;line-height:1.2}
.pz .tg{font-size:11px;color:var(--soft)}
.pz .st{position:absolute;top:12px;left:12px}
.pz.sel{border-color:var(--leaf)}
.pz .ck{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center}
.pz.sel .ck{background:var(--leaf);border-color:var(--leaf);color:var(--on)}
.pz .ck svg{width:15px;height:15px}
.pz.dim{opacity:.55}
.tl{list-style:none;margin:0;padding:6px 0 0}
.tl li{display:grid;grid-template-columns:16px 1fr;gap:12px;padding-bottom:16px;position:relative}
.tl li::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl i{width:14px;height:14px;border-radius:50%;background:var(--teal);margin-top:3px}
.tl .w{font-size:12px;color:var(--soft)}
.tl .a{font-weight:600}
.tl .n{font-size:13px;color:var(--soft)}
.passcard{background:#fff;color:#1C2321;border-radius:22px;padding:18px;margin-top:12px;display:flex;gap:16px;align-items:center}
.passcard .qr{width:124px;height:124px;flex:none}
.passcard .qr img,.passcard .qr canvas{width:124px!important;height:124px!important}
.passcard .no{font:800 30px "Fraunces",sans-serif;letter-spacing:-.03em;color:#211F1B}
/* guard */
.gh{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.gb{border:0;border-radius:26px;min-height:150px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:18px;color:var(--on);text-align:left}
.gb svg{width:36px;height:36px}
.gb b{font:800 30px/1 "Fraunces",sans-serif;letter-spacing:-.02em}
.gb span{font-size:14px;opacity:.85;display:block;margin-top:4px}
.gb.wide{grid-column:1/-1;min-height:120px}
.gb.a{background:var(--ink)}.gb.o{background:var(--soft)}.gb.d{background:var(--mari-bg);color:var(--mari-soft)}.gb.f{background:var(--ink);color:var(--bg);min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;grid-column:1/-1}
.gb.f b{font-size:22px}
.gcard{display:flex;gap:14px;align-items:center;width:100%;border:0;background:var(--card);border-radius:22px;padding:16px;text-align:left}
.gcard .pl{font:700 19px/1.2 "Fraunces",sans-serif}
.gcard .ln{font-size:14px;color:var(--soft);margin-top:3px}
.verdict{border-radius:24px;padding:20px;margin:6px 0 12px}
.verdict.ok{background:var(--leaf-soft);color:var(--leaf)}
.verdict.no{background:var(--red-soft);color:var(--red)}
.verdict b{font:800 32px/1 "Fraunces",sans-serif;display:block}
.verdict span{color:var(--ink);display:block;margin-top:6px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:22px;padding:10px}
.stepper button{width:64px;height:64px;border-radius:18px;border:0;background:var(--sunk);font-size:30px;font-weight:700}
.stepper b{font:800 40px "Fraunces",sans-serif}
.stepper span{display:block;text-align:center;font-size:13px;color:var(--soft);font-weight:600}
.shot{border:2px dashed var(--line);border-radius:22px;background:var(--card);width:100%;min-height:120px;display:grid;place-items:center;padding:12px;font-weight:700;color:var(--soft);overflow:hidden;margin-top:12px}
.shot svg{width:32px;height:32px;display:block;margin:0 auto 6px;color:var(--teal)}
.shot img{max-height:180px;border-radius:14px}
.num{font:800 38px "Fraunces",sans-serif;text-align:center;padding:16px;background:var(--card);border-radius:22px;letter-spacing:.02em;min-height:78px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.keys button{border:0;background:var(--card);border-radius:18px;font-size:28px;font-weight:700;padding:15px 0}
.log .kv .k{font-weight:600;color:var(--ink)}
/* table */
.tw{overflow-x:auto;background:var(--card);border-radius:18px}
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th,.tb td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tb th{color:var(--soft);font-weight:600}
.menu{background:var(--card);border-radius:22px;overflow:hidden}
.menu button{display:flex;align-items:center;gap:14px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:16px;text-align:left;font-weight:700}
.menu button:last-child{border-bottom:0}
.menu small{display:block;font-weight:400;color:var(--soft);font-size:13px}
.menu .em{font-size:22px;width:28px;text-align:center}
.seg{display:flex;background:var(--sunk);border-radius:14px;padding:4px;margin-bottom:10px}

function state(m){if(late(m))return["overdue",`${-diff(m.due)} day${diff(m.due)===-1?"":"s"} late`];
 switch(m.status){case"pending":return["pending","Waiting for OK"];case"approved":return["approved","Ready to go"];case"changes":return["changes","Needs changes"];
  case"rejected":return["rejected","Declined"];case"cancelled":return["cancelled","Cancelled"];case"delivered":return["delivered",m.unverified?"Check this":"Delivered"];case"closed":return["closed","All back"];}
 if(m.coming&&diff(m.coming.t.slice(0,10))===0)return["coming","Coming today"];
 const d=diff(m.due);return["out",!m.returnable?"Out":d===0?"Due today":d===1?"Due tomorrow":"Back "+fDay(m.due)]}

 return Object.values(map).map(r=>{const outs=r.hist.filter(h=>(isOut(h.m)||h.m.status==="approved")&&!h.p.back);
  const lastIssue=r.hist.length&&r.hist[r.hist.length-1].p.cond!=="Good"?r.hist[r.hist.length-1].p.cond:"";
  const lastDel=r.hist.length&&r.hist[r.hist.length-1].m.status==="delivered";
  r.where=outs.length?(late(outs[0].m)?["overdue","Late · "+place(outs[0].m).name]:outs[0].m.status==="approved"?["approved","Leaving · "+place(outs[0].m).name]:["out","At "+place(outs[0].m).name]):lastDel?["delivered","Delivered"]:lastIssue?["issue",lastIssue]:["in","In store"];
  r.outs=outs;return r})}

 img.onload=()=>{const s=Math.min(1,320/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);cb(c.toDataURL("image/jpeg",.62))};img.src=u};inp.click()}
function scanQR(cb){const inp=$("#cam");inp.value="";inp.onchange=()=>{const f=inp.files[0];if(!f)return;const img=new Image(),u=URL.createObjectURL(f);
 img.onload=()=>{const s=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);const x=c.getContext("2d");x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
  let code=null;try{const d=x.getImageData(0,0,c.width,c.height);const r=window.jsQR&&jsQR(d.data,c.width,c.height);if(r)code=r.data}catch(e){}
  const m=code&&code.match(/VM-\d+/i);if(m)cb(m[0].toUpperCase());else toast("Couldn't read a pass. Type the number instead.")};img.src=u};inp.click()}

/* ============ render ============ */
function render(){try{renderInner()}catch(e){console.error(e);showCrash(e)}}
function showCrash(e){const r=$("#root");if(!r)return;r.innerHTML=`<div class="wrap" style="padding-top:40px"><div class="empty"><b>Something went wrong on this screen.</b>${esc(e&&e.message||"")}<div class="row" style="margin-top:14px;justify-content:center"><button class="btn p" onclick="location.reload()">Reload</button><button class="btn" id="goHome">Go home</button></div></div></div>`;const g=$("#goHome");if(g)g.onclick=()=>{hist=[];route={n:"home"};sheetH="";W=null;R=null;guardReset();render()}}
function renderInner(){
 const root=$("#root");
 if(role==="guard"){root.innerHTML=guardView()+(sheetH?sheetWrap():"");return}
 let b="";
 switch(route.n){
  case"home":b=role==="manager"?mHome():role==="team"?tHome():sHome();break;
  case"approvals":b=approvals();break;case"search":b=search();break;case"more":b=more();break;
  case"move":b=moveView(route.id);break;case"item":b=itemView(route.key);break;
  case"wiz":b=wizard();break;case"exp":b=expWizard();break;case"receive":b=receiveView();break;
  case"reports":b=reports();break;case"notifs":b=notifs();break;case"settings":b=settings();break;
 }
 const wiz=route.n==="wiz"||route.n==="exp"||route.n==="receive";
 root.innerHTML=`<div class="wrap">${wiz?"":topbar()}<main>${b}</main></div>${wiz?"":nav()}${sheetH?sheetWrap():""}`;
 document.querySelectorAll(".qrm").forEach(el=>{if(!window.QRCode){el.innerHTML=`<div style="font:800 18px sans-serif;color:#211F1B;display:grid;place-items:center;height:124px;text-align:center">${esc(el.dataset.id)}</div>`;return}{el.innerHTML="";new QRCode(el,{text:"VAANIO-MOVE:"+el.dataset.id,width:124,height:124,correctLevel:QRCode.CorrectLevel.M})}});
}
const sheetWrap=()=>`<div class="scrim" data-a="closeSheet"><div class="sheet" role="dialog" aria-modal="true" data-a="noop"><div class="grab"></div>${sheetH}</div></div>`;
function topbar(){const un=S.notifs.length-S.seen;
 return`<header class="bar"><div class="logo hd"><i>${I.move}</i>Move</div><div class="sp"></div>
 <button class="ib" data-a="notifs" aria-label="Notifications">${I.bell}${un>0?'<span class="dot"></span>':""}</button>
 <button class="me" data-a="roleSheet"><span class="av">${ini(me())}</span>${ROLES[role].label}</button></header>`}
function nav(){
 const pend=S.moves.filter(m=>m.status==="pending").length,rc=S.arrivals.filter(a=>a.status!=="received").length;
 const T=role==="manager"?[["home","Home",I.home],["approvals","Approvals",I.ok,pend],["plus"],["search","Find",I.search],["more","More",I.grid]]
  :role==="team"?[["home","Home",I.home],["plus"],["search","Find",I.search]]
  :[["home","Receive",I.inbox,rc],["search","Find",I.search]];
 const cur=["reports","notifs","settings"].includes(route.n)?"more":route.n;
 return`<nav class="nav" aria-label="Main"><div>${T.map(t=>t[0]==="plus"?`<button class="plus" data-a="plus" aria-label="New"><span class="c">${I.plus}</span></button>`
  :`<button data-a="tab" data-x="${t[0]}" ${cur===t[0]?'aria-current="page"':""}>${t[2]}<span>${t[1]}</span>${t[3]?`<span class="bd">${t[3]}</span>`:""}</button>`).join("")}</div></nav>`}
function mcard(m){const ps=m.status==="partial"?left(m):m.pieces;const pl=place(m);
 return`<button class="mc" data-a="open" data-x="${m.id}">${stack(ps)}<div><div class="pl">${esc(pl.name)}</div>
 <div class="ln">${esc(m.purpose)} · ${ps.length} pc${ps.length===1?"":"s"}${m.status==="partial"?" left":""} · ${esc(person(m).name)}</div></div>
 <div class="rt">${chip(m)}<span class="no">${m.id}</span></div></button>`}
const cards=(ms,empty)=>ms.length?`<div class="cards">${ms.map(mcard).join("")}</div>`:`<div class="empty">${empty}</div>`;
const hello=()=>{const h=new Date().getHours();return(h<12?"Good morning":h<17?"Good afternoon":"Good evening")+", "+me().split(" ")[0]};

/* ---- manager home ---- */
function mHome(){
 const outs=S.moves.filter(isOut),pcs=outs.reduce((a,m)=>a+left(m).length,0),places=new Set(outs.map(m=>m.placeId)).size;
 const pend=S.moves.filter(m=>m.status==="pending").length,lt=S.moves.filter(late).length,unk=S.arrivals.filter(a=>a.status==="unknown").length,chk=S.moves.filter(m=>m.unverified).length;
 const sorted=outs.slice().sort((a,b)=>(a.due||"9")<(b.due||"9")?-1:1);
 const ready=S.moves.filter(m=>m.status==="approved");
 return`<p class="sub" style="margin:4px 0 8px">${hello()}</p>
 <section class="hero">
  <div class="big">${pcs}</div><div class="lbl">piece${pcs===1?"":"s"} out right now</div><div class="meta">at ${places} place${places===1?"":"s"} · ${S.moves.filter(m=>isOut(m)&&m.returnable&&diff(m.due)===0).length} due back today</div></section>
 ${pend+lt+unk+chk?`<div class="need">
  ${pend?`<button class="nd a" data-a="tab" data-x="approvals"><b>${pend}</b><span>Waiting for your OK</span></button>`:""}
  ${lt?`<button class="nd r" data-a="findF" data-x="late"><b>${lt}</b><span>Running late</span></button>`:""}
  ${unk?`<button class="nd t" data-a="whose"><b>${unk}</b><span>Parcel nobody claimed</span></button>`:""}
  ${chk?`<button class="nd a" data-a="findF" data-x="check"><b>${chk}</b><span>Left without a pass</span></button>`:""}</div>`:""}
 <h2 class="hd">What's out <small>soonest back first</small></h2>
 ${cards(sorted,"<b>Everything is home.</b>Nothing is out right now.")}
 ${ready.length?`<h2 class="hd">Ready at the gate <small>${ready.length}</small></h2>${cards(ready)}`:""}
 <h2 class="hd">Today at the gate</h2>${gateLog()}`}
function gateLog(){const ev=[];const t=today();
 S.moves.forEach(m=>{if(m.gateOut&&m.gateOut.t.slice(0,10)===t)ev.push([m.gateOut.t,m.returnable?"↗ Out":"📦 Delivery",place(m).name])});
 S.arrivals.forEach(a=>{if(a.t.slice(0,10)===t)ev.push([a.t,"↙ In",a.moveId?place(find(a.moveId)).name:a.expId?place(S.expected.find(e=>e.id===a.expId).placeId).name:"Unknown · "+a.bags+" bag"+(a.bags>1?"s":"")])});
 ev.sort((a,b)=>a[0]<b[0]?1:-1);
 return ev.length?`<div class="box log">${ev.map(e=>`<div class="kv"><span class="k">${e[1]}</span><span class="v">${esc(e[2])}<small>${fTime(e[0])}</small></span></div>`).join("")}</div>`:`<div class="empty">Quiet so far today.</div>`}

/* ---- team home ---- */
function tHome(){
 const mine=S.moves.filter(m=>m.owner===me());
 const dueNow=mine.filter(m=>isOut(m)&&m.returnable&&diff(m.due)<=0&&!(m.coming&&diff(m.coming.t.slice(0,10))===0));
 const unk=S.arrivals.filter(a=>a.status==="unknown"&&!(a.notMine||[]).includes(me()));
 const active=mine.filter(m=>["pending","approved","out","partial","changes"].includes(m.status)).sort((a,b)=>a.createdAt<b.createdAt?1:-1);
 const exp=S.expected.filter(e=>e.owner===me()&&e.status==="open");
 return`<h1 class="hd">${hello()}</h1><p class="sub">Here's what needs you today.</p>
 ${dueNow.map(m=>`<div class="prompt"><div class="t">${esc(place(m).name)} ${late(m)?"is late":"is due back today"}</div>
  <div class="d">${left(m).length} piece${left(m).length===1?"":"s"} · ${m.id}. Let the gate know what to expect.</div>
  <div class="row"><button class="btn p w" data-a="coming" data-x="${m.id}">Coming today</button><button class="btn w" data-a="delay" data-x="${m.id}">Needs 1 more day</button></div></div>`).join("")}
 ${unk.map(a=>`<div class="prompt q"><div class="t">Is this parcel yours?</div><div class="d">${a.bags} bag${a.bags>1?"s":""} at the store · ${fWhen(a.t)}${a.porter?" · brought by "+esc(a.porter):""}</div>
  ${a.photo?`<img src="${a.photo}" alt="" style="border-radius:14px;max-height:140px;margin-bottom:10px">`:""}
  <div class="row"><button class="btn p w" data-a="claim" data-x="${a.id}">Yes, it's mine</button><button class="btn w" data-a="notMine" data-x="${a.id}">Not mine</button></div></div>`).join("")}
 ${!dueNow.length&&!unk.length?`<div class="empty" style="margin-bottom:6px"><b>You're all set.</b>Nothing needs you right now.</div>`:""}
 <h2 class="hd">My movements <small>${active.length}</small></h2>${cards(active,"<b>Nothing out.</b>Tap + to send something.")}
 ${exp.length?`<h2 class="hd">I'm expecting</h2><div class="cards">${exp.map(e=>`<div class="mc" style="grid-template-columns:auto 1fr auto">${tile({name:e.what,category:e.what,color:""})}<div><div class="pl">${esc(place(e.placeId).name)}</div><div class="ln">${esc(e.what)}</div></div><span class="chip k-pending">${rel(e.due)}</span></div>`).join("")}</div>`:""}`}

/* ---- store home ---- */
function sHome(){
 const wait=S.arrivals.filter(a=>a.status==="atstore"),unk=S.arrivals.filter(a=>a.status==="unknown"),exp=expectedToday();
 const arrCard=a=>{let pl,ln,ps=[];if(a.moveId){const m=find(a.moveId);pl=place(m).name;ps=left(m);ln=`Return · ${ps.length} piece${ps.length===1?"":"s"} expected · ${m.id}`}
  else if(a.expId){const e=S.expected.find(x=>x.id===a.expId);pl=place(e.placeId).name;ln="Delivery · "+e.what;ps=[{name:e.what,category:e.what}]}
  else{pl="New stock";ln=""}
  return`<button class="mc" data-a="recv" data-x="${a.id}">${ps.length?stack(ps):tile({name:"parcel",category:"bag"})}<div><div class="pl">${esc(pl)}</div><div class="ln">${ln} · ${a.bags} bag${a.bags>1?"s":""}</div></div><div class="rt"><span class="chip k-approved">Open it</span><span class="no">${fTime(a.t)}</span></div></button>`};
 return`<h1 class="hd">${hello()}</h1><p class="sub">Open each parcel and tap the pieces you find.</p>
 <h2 class="hd">Waiting to be opened <small>${wait.length}</small></h2>${wait.length?`<div class="cards">${wait.map(arrCard).join("")}</div>`:`<div class="empty"><b>Nothing waiting.</b>New parcels from the gate show up here.</div>`}
 ${unk.length?`<h2 class="hd">Holding shelf <small>nobody's claimed these</small></h2><div class="cards">${unk.map(a=>`<button class="mc" data-a="identify" data-x="${a.id}">${a.photo?`<div class="tile"><img src="${a.photo}" alt=""></div>`:tile({name:"?",category:"bag"})}
  <div><div class="pl">Unknown parcel</div><div class="ln">${a.bags} bag${a.bags>1?"s":""}${a.porter?" · "+esc(a.porter):""} · ${fWhen(a.t)}</div></div><div class="rt"><span class="chip k-pending">Identify</span></div></button>`).join("")}</div>`:""}
 <h2 class="hd">Expected today <small>${exp.length}</small></h2>${exp.length?`<div class="cards">${exp.map(x=>`<div class="mc">${x.kind==="ret"?stack(left(x.m)):tile({name:x.e.what,category:x.e.what})}<div><div class="pl">${esc(x.pl.name)}</div><div class="ln">${x.kind==="ret"?`Return · ${x.n} pieces · ${x.m.id}`:"Delivery · "+esc(x.e.what)}</div></div><div class="rt">${x.kind==="ret"?chip(x.m):`<span class="chip k-pending">Today</span>`}</div></div>`).join("")}</div>`:`<div class="empty">Nothing expected today.</div>`}`}

/* ---- approvals ---- */

 return`<h1 class="hd">Waiting for your OK</h1><p class="sub">Nothing leaves until you approve it.</p>
 ${p.length?p.map(m=>{const pl=place(m);return`<div class="box" style="padding:16px">

   <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><div class="hd" style="font-size:20px;font-weight:700">${esc(pl.name)}</div>
   <div class="muted sm">${esc(m.purpose)} · by ${esc(m.owner)} · ${fWhen(m.createdAt)}</div></div><span class="no muted sm">${m.id}</span></div>

/* ---- search ---- */
const FL=[["all","All"],["out","Out now"],["late","Late"],["pending","Waiting"],["ready","Ready"],["back","All back"],["delivered","Delivered"],["check","To check"],["issue","Damaged"],["cancelled","Cancelled"]];
function fmatch(m,f){switch(f){case"out":return isOut(m);case"late":return late(m);case"pending":return m.status==="pending";case"ready":return m.status==="approved";
 case"back":return m.status==="closed";case"delivered":return m.status==="delivered";case"check":return!!m.unverified;case"issue":return m.pieces.some(p=>p.cond!=="Good");case"cancelled":return m.status==="cancelled";}return true}
function qmatch(m,q){if(!q)return true;const pl=place(m),pe=person(m);
 const h=[m.id,m.purpose,m.note,pl.name,pl.area,pl.contact,pl.phone,pe.name,pe.phone,m.owner,m.approver,m.invoiceNo,m.orderNo,fDay(m.createdAt),...m.pieces.flatMap(p=>[p.name,p.code,p.tag,p.color])].join(" ").toLowerCase();
 return q.toLowerCase().split(/\s+/).every(w=>h.includes(w))}
function search(){return`<h1 class="hd">Find anything</h1>
 <div class="search">${I.search}<input data-in="sq" type="search" value="${esc(sq.q)}" placeholder="Red lehenga, Aman, Studio XYZ, 10482…" aria-label="Search"></div>
 <div class="seg" role="group"><button data-a="seg" data-x="moves" aria-pressed="${sq.seg==="moves"}">Movements</button><button data-a="seg" data-x="items" aria-pressed="${sq.seg==="items"}">Pieces</button></div>
 ${sq.seg==="moves"?`<div class="hs">${FL.map(([k,l])=>`<button class="cs" data-a="sf" data-x="${k}" aria-pressed="${sq.f===k}">${l}</button>`).join("")}</div>`:""}
 <div id="res">${results()}</div>`}
function results(){
 if(sq.seg==="items"){const q=sq.q.toLowerCase();const rs=productUnits().filter(r=>!q||(r.name+" "+r.code+" "+r.category+" "+r.color).toLowerCase().includes(q))
  .sort((a,b)=>{const o={overdue:0,out:1,approved:2,issue:3,in:4,delivered:5};return o[a.where[0]]-o[b.where[0]]||a.name.localeCompare(b.name)});
  return rs.length?`<div class="cards">${rs.map(r=>`<button class="mc" data-a="item" data-x="${esc(r.key)}">${tile(r)}<div><div class="pl">${esc(r.name)}</div><div class="ln">${esc(r.code||"No code")} · ${r.hist.length} trip${r.hist.length===1?"":"s"}</div></div><div class="rt"><span class="chip k-${r.where[0]}">${esc(r.where[1])}</span></div></button>`).join("")}</div>`:`<div class="empty">No pieces match.</div>`}
 const ms=S.moves.filter(m=>fmatch(m,sq.f)&&qmatch(m,sq.q)).sort((a,b)=>a.createdAt<b.createdAt?1:-1);
 return cards(ms,"<b>Nothing matches.</b>Try another word or tap All.")}

/* ---- movement detail ---- */
function moveView(id){const m=find(id);if(!m)return`<div class="empty">Not found.</div>`;const pl=place(m),pe=person(m),st=stage(m);
 const steps=m.returnable?["Asked","Approved","Out","Back"]:["Asked","Approved","Out","Delivered"];
 let act="";
 if(role==="manager"&&m.status==="pending")act=`<div class="row" style="margin-top:14px"><button class="btn g w" data-a="approve" data-x="${m.id}">${I.ok}Approve</button><button class="btn w" data-a="declineSheet" data-x="${m.id}">Not now</button></div>`;
 else if(role==="manager"&&m.unverified)act=`<div class="prompt" style="margin-top:14px"><div class="t">Left the gate without a pass</div><div class="d">Check the invoice or order, then mark it verified.</div><button class="btn g full" data-a="verify" data-x="${m.id}">Looks right, mark verified</button></div>`;
 else if(m.owner===me()&&m.status==="changes")act=`<div class="prompt" style="margin-top:14px"><div class="t">${esc(((m.log.slice().reverse().find(l=>l.a.startsWith("Sent back"))||{}).n)||"Changes needed")}</div><div class="d">Fix it and send it again.</div><button class="btn p full" data-a="edit" data-x="${m.id}">Fix and resend</button></div>`;
 else if(role!=="store"&&isOut(m)&&m.returnable&&!(m.coming&&diff(m.coming.t.slice(0,10))===0))act=`<div class="row" style="margin-top:14px"><button class="btn p w" data-a="coming" data-x="${m.id}">Coming back today</button><button class="btn w" data-a="delay" data-x="${m.id}">1 more day</button></div>`;
 if(role==="store"&&isOut(m))act+=`<button class="btn g full" style="margin-top:10px" data-a="recvMove" data-x="${m.id}">Receive pieces now</button>`;
 if(role==="manager"&&["pending","approved","changes"].includes(m.status))act+=`<button class="btn x full" style="margin-top:10px" data-a="cancelSheet" data-x="${m.id}">Cancel this entry</button>`;
 if(m.status==="cancelled"){const c=m.log.slice().reverse().find(l=>l.a==="Cancelled")||{};act=`<div class="prompt" style="margin-top:14px;border-left-color:var(--soft)"><div class="t">Cancelled · ${esc(c.n||"")}</div><div class="d">By ${esc(c.who||"")} · ${c.t?fWhen(c.t):""}. It stays in history but doesn't count anywhere.</div></div>`}
 const backN=m.pieces.filter(p=>p.back).length;
 return`<button class="back" data-a="back">${I.back}Back</button>
 <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div><h1 class="hd" style="margin-bottom:2px">${esc(pl.name)}</h1><div class="muted">${esc(m.purpose)} · ${m.id}</div></div>${chip(m)}</div>
 <div class="journey">${steps.map((s,i)=>`<div class="js ${i<=st?"on":""} ${i===st?"now":""}"><i></i>${s}</div>`).join("")}</div>
 ${act}
 <div class="box">
  <div class="kv"><span class="k">Going to</span><span class="v">${tem(pl.type)} ${esc(pl.name)}<small>${esc(pl.area)}${pl.phone?` · <a href="tel:${esc(digits(pl.phone))}" style="color:var(--teal)">${esc(pl.phone)}</a>`:""}</small></span></div>
  <div class="kv"><span class="k">Taken by</span><span class="v">${esc(pe.name)}<small>${esc(pe.role)}${pe.phone?" · "+esc(pe.phone):""}</small></span></div>
  <div class="kv"><span class="k">${m.returnable?"Back by":"Returning"}</span><span class="v">${m.returnable?`${rel(m.due)}${m.due&&rel(m.due)!==fDay(m.due)?`<small>${DAY[new Date(m.due+"T00:00").getDay()]}, ${fDay(m.due)}</small>`:""}`:"No, one-way"}</span></div>
  <div class="kv"><span class="k">Asked by</span><span class="v">${esc(m.owner)}</span></div>
  <div class="kv"><span class="k">Approved by</span><span class="v">${esc(m.approver||"Not yet")}</span></div>
  ${m.invoiceNo||m.orderNo?`<div class="kv"><span class="k">Invoice / order</span><span class="v">${esc([m.invoiceNo,m.orderNo].filter(Boolean).join(" · "))}</span></div>`:""}
  ${m.note?`<div class="kv"><span class="k">Note</span><span class="v">${esc(m.note)}</span></div>`:""}
  ${m.gateOut&&m.gateOut.note?`<div class="kv"><span class="k">Gate note</span><span class="v">${esc(m.gateOut.note)}<small>by ${esc(m.gateOut.by)}</small></span></div>`:""}
 </div>
 ${["approved","out","partial"].includes(m.status)?`<button class="btn full" style="margin-top:12px" data-a="pass">${I.qr}${showPass?"Hide gate pass":"Show gate pass"}</button>
  ${showPass?`<div class="passcard"><div class="qr qrm" data-id="${m.id}"></div><div><div class="sm" style="color:#5D6A66">Show this at the gate</div><div class="no">${m.id}</div><div class="sm" style="margin-top:4px">${esc(S.company)} · ${m.pieces.length} pieces</div></div></div>`:""}`:""}
 <h2 class="hd">Pieces <small>${m.gateOut?`${backN} of ${m.pieces.length} back`:m.pieces.length}</small></h2>

  R=null;save();hist=[];route={n:"home"};toast(rest?`Saved. ${rest} still out.`:"All back. Closed.");window.scrollTo(0,0)},
 rExpOk:()=>{const e=S.expected.find(x=>x.id===R.expId);e.status="done";const a=S.arrivals.find(q=>q.id===R.arr);if(a)a.status="received";note("✅",`${e.what} from ${place(e.placeId).name} received.`);R=null;save();hist=[];route={n:"home"};toast("Received")},
 rExpIssue:()=>{const e=S.expected.find(x=>x.id===R.expId);e.status="done";const a=S.arrivals.find(q=>q.id===R.arr);if(a)a.status="received";note("⚠️",`Problem with ${e.what.toLowerCase()} from ${place(e.placeId).name}. Please check.`);R=null;save();hist=[];route={n:"home"};toast("Manager has been told")},
 rNewOk:()=>{const a=S.arrivals.find(q=>q.id===R.arr);if(a)a.status="received";note("📦","New stock received at the store.");R=null;save();hist=[];route={n:"home"};toast("Received as new stock")},
 csv:async()=>{const[t,h,fn]=REP[repK];const csv=[h,...fn()].map(r=>r.map(c=>`"${String(c==null?"":c).replace(/"/g,'""')}"`).join(",")).join("\n");
  try{const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;if(!dl){const u=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));const a=document.createElement("a");a.href=u;a.download=`vaanio-move-${repK}-${today()}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return false}
   await dl.save({filename:`vaanio-move-${repK}-${today()}.csv`,data:new Blob([csv],{type:"text/csv"})})}catch(e){if(e&&e.code!=="cancelled")toast("Download didn't finish")}return false},
 saveCo:()=>{S.company=($("#co").value.trim())||S.company;save();toast("Saved")},
 reset:()=>{if(confirm("Start the demo again? Your changes will be cleared.")){S=seed();save();hist=[];route={n:"home"};toast("Demo data is back")}},
 /* guard */
 gTo:x=>{if(x==="home"||x==="out"||x==="arrive"||x==="deliver"||x==="find"||x==="keys"){G.num="";G.photo="";G.note="";G.bags=1}G.mode=x;window.scrollTo(0,0)},
 gBags:x=>{G.bags=Math.max(1,Math.min(50,G.bags+ +x))},
 gPhoto:()=>{takePhoto(p=>{if(G.mode==="deliverNew")G.d.photo=p;G.photo=p;render()});return false},
 gArr:x=>{G.sel=expectedToday()[+x];G.bags=1;G.photo="";G.mode="arriveOk";window.scrollTo(0,0)},
 gArrSave:()=>{const x=G.sel;const a={id:uid(),t:now(),bags:G.bags,photo:G.photo,porter:"",moveId:x.kind==="ret"?x.m.id:null,expId:x.kind==="exp"?x.e.id:null,status:"atstore",guard:me()};S.arrivals.push(a);
  if(x.kind==="ret")log(x.m,`Arrived at Gate 1 · ${G.bags} bag${G.bags>1?"s":""}`);if(x.kind==="exp")x.e.status="arrived";
  note("📥",`${x.pl.name}: ${G.bags} bag${G.bags>1?"s":""} at the gate, sent to the store.`);save();guardReset();toast("Sent to the store")},
 gUnkSave:()=>{S.arrivals.push({id:uid(),t:now(),bags:G.bags,photo:G.photo,porter:G.porter.trim(),moveId:null,expId:null,status:"unknown",guard:me(),notMine:[]});
  note("❓",`A parcel came in and nobody knows whose it is. ${G.bags} bag${G.bags>1?"s":""}, on the holding shelf.`);save();guardReset();toast("On the holding shelf. The team will be asked.")},
 gPick:x=>{G.sel=x;G.photo="";G.mode="verify";window.scrollTo(0,0)},
 gKey:x=>{if(x==="del")G.num=G.num.slice(0,-1);else if(x==="go"){if(!G.num)return false;G.sel="VM-"+G.num;G.photo="";G.mode="verify"}else if(G.num.length<7)G.num+=x},
 gScan:x=>{scanQR(id=>{const m=find(id);if(x==="ret"&&m&&isOut(m)){G.sel={kind:"ret",m,pl:place(m),n:left(m).length};G.mode="arriveOk"}else{G.sel=id;G.mode="verify"}G.photo="";render()});return false},
 gAllow:()=>{const m=find(G.sel);const nt=G.note.trim();m.gateOut={by:me(),t:now(),photo:G.photo,note:nt};m.status=m.returnable?"out":"delivered";
  log(m,m.returnable?"Left from Gate 1":"Picked up at Gate 1",[G.photo?"Photo taken":"",nt].filter(Boolean).join(" · "));
  note(m.returnable?"↗️":"📦",`${m.id}: ${m.pieces.length} pieces ${m.returnable?"left for":"picked up by"} ${place(m).name}.${nt?" Gate note: "+nt:""}`);save();guardReset();toast(m.returnable?"Allowed out":"Handed over")},
 gDelSave:()=>{const d=G.d;if(![d.inv,d.ord,d.name,d.photo].some(v=>String(v||"").trim())){toast("Add an invoice, order, name or photo");return false}
  const dn=d.note.trim();
  const pl={id:"pl"+uid(),name:d.name.trim()||"Walk-in pickup",type:"Customer",area:"Picked up at Gate 1",contact:d.name.trim(),phone:d.phone.trim()};S.places.push(pl);
  const pe={id:"pe"+uid(),name:d.name.trim()||"Not given",role:"Customer",phone:d.phone.trim()};S.people.push(pe);
  const m={id:"VM-"+(S.seq++),status:"delivered",unverified:true,purpose:"Customer delivery",note:["Picked up without a pass",dn].filter(Boolean).join(" · "),placeId:pl.id,personId:pe.id,returnable:false,due:"",invoiceNo:d.inv.trim(),orderNo:d.ord.trim(),owner:me(),approver:"",createdAt:now(),
   pieces:[mkPiece({name:"Order parcel",category:"bag",photo:d.photo})],gateOut:{by:me(),t:now(),photo:d.photo,note:dn},log:[]};
  log(m,"Picked up at Gate 1 without a pass",[m.invoiceNo&&"Invoice "+m.invoiceNo,m.orderNo&&"Order "+m.orderNo,dn].filter(Boolean).join(" · "));S.moves.push(m);
  note("⚠️",`Order picked up without a pass${m.invoiceNo?" · Invoice "+m.invoiceNo:""}. Please check ${m.id}.${dn?" Gate note: "+dn:""}`);save();guardReset();toast("Pickup recorded")}
};
function openRecv(a){if(a.moveId){const m=find(a.moveId);R={kind:"move",moveId:m.id,arr:a.id,sel:Object.fromEntries(left(m).map(p=>[p.id,true])),cond:{}}}
 else if(a.expId)R={kind:"exp",expId:a.expId,arr:a.id};else R={kind:"new",arr:a.id};go({n:"receive"})}
function customSheetHtml(){const c=W._c;sheetH=`<h3>Add a piece</h3><p class="muted" style="margin:0 0 12px">A photo and a type is enough. The code is optional.</p>
 <button class="shot" data-a="cPhoto" style="margin-top:0">${c.photo?`<img src="${c.photo}" alt="">`:`<span>${I.cam}Take a photo</span>`}</button>

 <div class="two" style="margin-top:14px"><div class="fld"><label class="fl" for="cn">Name (optional)</label><input class="inp" id="cn" value="${esc(c.name)}" placeholder="${esc(c.category||"Red lehenga")}"></div><div class="fld"><label class="fl" for="cc">Code (optional)</label><input class="inp" id="cc"></div></div>

 <div class="chipsel" style="margin:12px 0 14px">${PLACE_TYPES.map(([t,e])=>`<button class="cs" data-a="pType" data-x="${t}" aria-pressed="${p.type===t}">${e} ${t}</button>`).join("")}</div>

/* inputs (no re-render while typing) */
const IN={
 sq:v=>{sq.q=v;const r=$("#res");if(r)r.innerHTML=results()},
 wq:v=>{W.q=v;const q=v.toLowerCase();document.querySelectorAll('[data-a="addP"]').forEach(b=>b.classList.toggle("hide",!!q&&!b.dataset.s.includes(q)))},
 pq:v=>{W.pq=v;const q=v.toLowerCase();const l=$("#placeList");if(l)l.querySelectorAll(".prow").forEach(b=>b.classList.toggle("hide",!!q&&!b.dataset.s.includes(q)))},
 xpq:v=>{W.pq=v;IN.pq(v)},
 peq:v=>{W.peq=v;const q=v.toLowerCase();const l=$("#personList");if(l)l.querySelectorAll(".prow").forEach(b=>b.classList.toggle("hide",!!q&&!b.dataset.s.includes(q)))},
 wDate:v=>{if(v){W.returnable=true;W.due=v;W.dueKey="pick";W.step++;render()}},
 wInv:v=>{W.inv=v},wOrd:v=>{W.ord=v},wNote:v=>{W.note=v},
 gPorter:v=>{G.porter=v},gNote:v=>{G.note=v},dInv:v=>{G.d.inv=v},dOrd:v=>{G.d.ord=v},dName:v=>{G.d.name=v},dPhone:v=>{G.d.phone=v},dNote:v=>{G.d.note=v}
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const f=A[el.dataset.a];if(!f)return;
 if(el.tagName==="A")return;e.preventDefault();const r=f(el.dataset.x,el);if(r!==false&&!(r instanceof Promise))render()});
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.in;if(k&&IN[k]&&e.target.type!=="date")IN[k](e.target.value)});
document.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.in;if(k==="wDate")IN.wDate(e.target.value)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheetH){sheetH="";render()}});

boot();
